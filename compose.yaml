services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workena
      POSTGRES_PASSWORD: workena_local_only
      POSTGRES_DB: workena
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - workena_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workena -d workena"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workena_postgres_data:
