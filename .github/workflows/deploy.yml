name: Deploy static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase configuration
        run: |
          if ! node -e '
            const rawUrl = process.env.VITE_SUPABASE_URL?.trim();
            const anonKey = process.env.VITE_SUPABASE_ANON_KEY?.trim();
            if (!rawUrl || !anonKey) process.exit(1);
            try {
              const url = new URL(rawUrl);
              if (url.protocol !== "https:" || !url.hostname.endsWith(".supabase.co")) process.exit(1);
            } catch {
              process.exit(1);
            }
          '; then
            echo "::error::Set VITE_SUPABASE_URL to the HTTPS Supabase Project URL (for example https://qutvxysezkyawwevxaxe.supabase.co) and set VITE_SUPABASE_ANON_KEY in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Build static site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
